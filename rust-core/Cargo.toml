[package]
name = "rynk_core"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rynk keyboard core: layouts, noisy-channel autocorrect and egui/Vulkan rendering"

[lib]
name = "rynk_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
wgpu = { version = "30", default-features = false, features = ["vulkan", "std", "wgsl"] }
pollster = "0.4"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
ndk-sys = "0.6"
raw-window-handle = "0.6"
android_logger = "0.15"
